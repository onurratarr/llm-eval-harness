[project]
name = "llm-eval-harness"
version = "0.1.0"
description = "Compact LLM evaluation harness: rubric + reference scoring, LLM-as-judge, pairwise preferences, Cohen's kappa, baseline regression gate."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Onur Atar" }]
dependencies = []

[project.optional-dependencies]
openai = ["httpx>=0.27"]
dev = ["pytest>=8"]

[project.scripts]
llm-eval = "llm_eval.cli:main"

[tool.setuptools]
packages = ["llm_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
